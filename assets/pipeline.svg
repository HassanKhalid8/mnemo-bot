<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Tone Forge pipeline: facts, gatekeeper, template, router, retry shield, audit, report">
  <title>The hot path — facts in, compliant copy out</title>
  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .nt{font-size:11.5px;font-weight:700;fill:#16202c;letter-spacing:.6px}
    .ns{font-size:9.5px;fill:#5a6a7d}
    .cap{font-size:11px;font-weight:600;fill:#8794a5;letter-spacing:1.6px}
    .card{fill:#ffffff;stroke:#d9e0ea;stroke-width:1.4;animation:glow 7s ease-in-out infinite}
    .n0{animation-delay:0s}.n1{animation-delay:.8s}.n2{animation-delay:1.6s}.n3{animation-delay:2.4s}
    .n4{animation-delay:3.2s}.n5{animation-delay:4s}.n6{animation-delay:4.8s}
    @keyframes glow{
      0%{stroke:#d9e0ea;fill:#ffffff}
      4%{stroke:#0f9e9b;fill:#eefaf9}
      11%{stroke:#0f9e9b;fill:#eefaf9}
      18%{stroke:#d9e0ea;fill:#ffffff}
      100%{stroke:#d9e0ea;fill:#ffffff}
    }
    .spark{fill:#0f9e9b;animation:shoot 7s ease-in-out infinite;opacity:0}
    .s0{animation-delay:.45s}.s1{animation-delay:1.25s}.s2{animation-delay:2.05s}
    .s3{animation-delay:2.85s}.s4{animation-delay:3.65s}.s5{animation-delay:4.45s}
    @keyframes shoot{
      0%{opacity:0;transform:translateX(0)}
      6%{opacity:1;transform:translateX(2px)}
      14%{opacity:1;transform:translateX(24px)}
      18%{opacity:0;transform:translateX(28px)}
      100%{opacity:0;transform:translateX(28px)}
    }
  </style>

  <rect width="1200" height="210" rx="16" fill="#f4f6f9"/>
  <text class="m cap" x="14" y="28">THE HOT PATH</text>
  <line x1="130" y1="24" x2="1186" y2="24" stroke="#e6ebf2" stroke-width="1.5"/>

  <g transform="translate(13,52)">
    <rect class="card n0" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#0f9e9b"/>
    <text class="f nt" x="26" y="30">FACTS</text>
    <text class="f ns" x="14" y="54">plain product data</text>
    <text class="f ns" x="14" y="70">never a prompt</text>
  </g>
  <g class="spark s0" transform="translate(160,98)"><circle r="3.5"/></g>
  <path d="M160 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M180 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(185,52)">
    <rect class="card n1" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#0f9e9b"/>
    <text class="f nt" x="26" y="30">GATEKEEPER</text>
    <text class="f ns" x="14" y="54">NFKC · de-fence</text>
    <text class="f ns" x="14" y="70">10 injection rules</text>
  </g>
  <g class="spark s1" transform="translate(332,98)"><circle r="3.5"/></g>
  <path d="M332 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M352 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(357,52)">
    <rect class="card n2" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#0f9e9b"/>
    <text class="f nt" x="26" y="30">TEMPLATE</text>
    <text class="f ns" x="14" y="54">platform contract</text>
    <text class="f ns" x="14" y="70">+ tone directive</text>
  </g>
  <g class="spark s2" transform="translate(504,98)"><circle r="3.5"/></g>
  <path d="M504 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M524 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(529,52)">
    <rect class="card n3" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#0b7c7a"/>
    <text class="f nt" x="26" y="30">ROUTER</text>
    <text class="f ns" x="14" y="54">real-time · bulk</text>
    <text class="f ns" x="14" y="70">· Batch API</text>
  </g>
  <g class="spark s3" transform="translate(676,98)"><circle r="3.5"/></g>
  <path d="M676 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M696 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(701,52)">
    <rect class="card n4" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#b8730b"/>
    <text class="f nt" x="26" y="30">RETRY SHIELD</text>
    <text class="f ns" x="14" y="54">tenacity backoff</text>
    <text class="m ns" x="14" y="70">delay = k·2ⁿ ± jitter</text>
  </g>
  <g class="spark s4" transform="translate(848,98)"><circle r="3.5"/></g>
  <path d="M848 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M868 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(873,52)">
    <rect class="card n5" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#0f9e9b"/>
    <text class="f nt" x="26" y="30">AUDIT</text>
    <text class="f ns" x="14" y="54">Pydantic strict</text>
    <text class="f ns" x="14" y="70">re-checks every rule</text>
  </g>
  <g class="spark s5" transform="translate(1020,98)"><circle r="3.5"/></g>
  <path d="M1020 98 h24" stroke="#d9e0ea" stroke-width="1.5"/>
  <path d="M1040 94 l5 4 -5 4" fill="none" stroke="#8794a5" stroke-width="1.4"/>

  <g transform="translate(1045,52)">
    <rect class="card n6" width="142" height="92" rx="12"/>
    <path d="M14 20 l6 6 -6 6 -6 -6 z" fill="#17a34a"/>
    <text class="f nt" x="26" y="30">REPORT</text>
    <text class="f ns" x="14" y="54">JSON · MD · CSV</text>
    <text class="f ns" x="14" y="70">· HTML · terminal</text>
  </g>

  <path d="M944 152 v18 H 600 v-18" fill="none" stroke="#d13b31" stroke-width="1.3" stroke-dasharray="4 4" opacity=".7"/>
  <path d="M604 158 l-4 -6 4 -6" fill="none" stroke="#d13b31" stroke-width="1.3" opacity=".7"/>
  <text class="f ns" x="700" y="186" fill="#d13b31">hard violation → repair at 0.6× temperature, then re-audit</text>
</svg>
