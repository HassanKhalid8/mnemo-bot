<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 216" width="1000" height="216" role="img" aria-label="Tone registry plotted on a temperature spectrum from technical 0.15 to playful 0.95">
  <title>Tone registry — every voice carries its own sampling temperature</title>
  <defs>
    <linearGradient id="tAxis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7c7a"/>
      <stop offset="0.5" stop-color="#0f9e9b"/>
      <stop offset="1" stop-color="#b8730b"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .cap{font-size:11px;font-weight:600;fill:#8794a5;letter-spacing:1.6px}
    .nm{font-size:12px;font-weight:600;fill:#16202c}
    .tp{font-size:10.5px;fill:#5a6a7d}
    .ax{font-size:10px;fill:#8794a5}
    .tick{stroke:#d9e0ea;stroke-width:1.3}
    .d{animation:pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pop{
      0%{transform:scale(1);opacity:.55}
      6%{transform:scale(1.75);opacity:1}
      14%{transform:scale(1);opacity:.55}
      100%{transform:scale(1);opacity:.55}
    }
    .d0{animation-delay:0s}.d1{animation-delay:.35s}.d2{animation-delay:.7s}
    .d3{animation-delay:1.05s}.d4{animation-delay:1.4s}.d5{animation-delay:1.75s}
    .d6{animation-delay:2.1s}.d7{animation-delay:2.45s}.d8{animation-delay:2.8s}
  </style>

  <rect width="1000" height="216" rx="16" fill="#f4f6f9"/>
  <text class="m cap" x="16" y="28">TONE REGISTRY · TEMPERATURE SPECTRUM</text>
  <line x1="330" y1="24" x2="984" y2="24" stroke="#e6ebf2" stroke-width="1.5"/>

  <rect x="70" y="127" width="860" height="6" rx="3" fill="url(#tAxis)"/>
  <text class="m ax" x="62" y="134" text-anchor="end">0.0</text>
  <text class="m ax" x="938" y="134">1.0</text>
  <text class="m ax" x="70" y="152">factual</text>
  <text class="m ax" x="930" y="152" text-anchor="end">chaotic</text>

  <!-- technical 0.15 -->
  <g><line class="tick" x1="199" y1="124" x2="199" y2="108"/>
    <text class="f nm" x="199" y="102" text-anchor="middle">technical</text>
    <text class="m tp" x="199" y="88" text-anchor="middle">T 0.15 · P 0.80</text>
    <circle class="d d0" cx="199" cy="130" r="6" fill="#0b7c7a"/></g>

  <!-- professional 0.25 -->
  <g><line class="tick" x1="285" y1="136" x2="285" y2="152"/>
    <text class="f nm" x="285" y="168" text-anchor="middle">professional</text>
    <text class="m tp" x="285" y="182" text-anchor="middle">T 0.25 · P 0.85</text>
    <circle class="d d1" cx="285" cy="130" r="6" fill="#0b7c7a"/></g>

  <!-- minimalist 0.35 -->
  <g><line class="tick" x1="371" y1="124" x2="371" y2="108"/>
    <text class="f nm" x="371" y="102" text-anchor="middle">minimalist</text>
    <text class="m tp" x="371" y="88" text-anchor="middle">T 0.35 · P 0.85</text>
    <circle class="d d2" cx="371" cy="130" r="6" fill="#0f9e9b"/></g>

  <!-- urgent 0.40 -->
  <g><line class="tick" x1="414" y1="136" x2="414" y2="152"/>
    <text class="f nm" x="414" y="168" text-anchor="middle">urgent</text>
    <text class="m tp" x="414" y="182" text-anchor="middle">T 0.40 · P 0.85</text>
    <circle class="d d3" cx="414" cy="130" r="6" fill="#0f9e9b"/></g>

  <!-- luxury 0.55 -->
  <g><line class="tick" x1="543" y1="124" x2="543" y2="108"/>
    <text class="f nm" x="543" y="102" text-anchor="middle">luxury</text>
    <text class="m tp" x="543" y="88" text-anchor="middle">T 0.55 · P 0.90</text>
    <circle class="d d4" cx="543" cy="130" r="6" fill="#0f9e9b"/></g>

  <!-- empathetic 0.60 -->
  <g><line class="tick" x1="586" y1="136" x2="586" y2="152"/>
    <text class="f nm" x="586" y="168" text-anchor="middle">empathetic</text>
    <text class="m tp" x="586" y="182" text-anchor="middle">T 0.60 · P 0.92</text>
    <circle class="d d5" cx="586" cy="130" r="6" fill="#0f9e9b"/></g>

  <!-- bold 0.70 -->
  <g><line class="tick" x1="672" y1="124" x2="672" y2="108"/>
    <text class="f nm" x="672" y="102" text-anchor="middle">bold</text>
    <text class="m tp" x="672" y="88" text-anchor="middle">T 0.70 · P 0.92</text>
    <circle class="d d6" cx="672" cy="130" r="6" fill="#5a9c6b"/></g>

  <!-- witty 0.85 -->
  <g><line class="tick" x1="801" y1="136" x2="801" y2="152"/>
    <text class="f nm" x="801" y="168" text-anchor="middle">witty</text>
    <text class="m tp" x="801" y="182" text-anchor="middle">T 0.85 · P 0.95</text>
    <circle class="d d7" cx="801" cy="130" r="6" fill="#b8730b"/></g>

  <!-- playful 0.95 -->
  <g><line class="tick" x1="887" y1="124" x2="887" y2="108"/>
    <text class="f nm" x="887" y="102" text-anchor="middle">playful</text>
    <text class="m tp" x="887" y="88" text-anchor="middle">T 0.95 · P 0.97</text>
    <circle class="d d8" cx="887" cy="130" r="6" fill="#b8730b"/></g>
</svg>
