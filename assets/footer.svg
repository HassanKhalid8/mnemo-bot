<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Tone Forge footer">
  <defs>
    <linearGradient id="fWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7c7a"/>
      <stop offset="1" stop-color="#0f9e9b"/>
    </linearGradient>
    <clipPath id="fClip"><rect x="0" y="0" width="1000" height="130" rx="16"/></clipPath>
  </defs>
  <style>
    .m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .ft{font-size:12px;fill:#5a6a7d;letter-spacing:.6px}
  </style>

  <rect width="1000" height="130" rx="16" fill="#f4f6f9"/>
  <g clip-path="url(#fClip)">
    <path d="M0 74 q125 -30 250 0 t250 0 t250 0 t250 0 V130 H0 Z" fill="url(#fWave)" opacity=".16">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 86 q125 -26 250 0 t250 0 t250 0 t250 0 V130 H0 Z" fill="url(#fWave)" opacity=".3">
      <animateTransform attributeName="transform" type="translate" values="-500 0;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 100 q125 -22 250 0 t250 0 t250 0 t250 0 V130 H0 Z" fill="url(#fWave)" opacity=".55">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M500 26 l8 8 -8 8 -8 -8 z" fill="#0f9e9b">
    <animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <text class="m ft" x="500" y="66" text-anchor="middle">DecodeLabs Industrial Training Kit · Batch 2026 · Generative AI Project 2</text>
</svg>
