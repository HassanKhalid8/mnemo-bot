<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="Platform character limits: LinkedIn 1300, Instagram 2200, Email 1600, X/Twitter 280, TikTok 2200, Facebook 2000, SMS 160">
  <title>Platform contracts — hard character ceilings and ideal bands</title>
  <defs>
    <linearGradient id="pBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7c7a"/>
      <stop offset="1" stop-color="#0f9e9b"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .cap{font-size:11px;font-weight:600;fill:#8794a5;letter-spacing:1.6px}
    .name{font-size:12.5px;font-weight:600;fill:#16202c}
    .val{font-size:11.5px;fill:#5a6a7d}
    .hard{font-size:11.5px;font-weight:700;fill:#d13b31}
    .key{font-size:10px;fill:#8794a5}
  </style>

  <rect width="960" height="336" rx="16" fill="#f4f6f9"/>
  <text class="m cap" x="16" y="28">PLATFORM CONTRACTS</text>
  <line x1="196" y1="24" x2="944" y2="24" stroke="#e6ebf2" stroke-width="1.5"/>

  <!-- scale: 2200 chars = 560px -->
  <g transform="translate(0,52)">
    <text class="f name" x="16" y="14">LinkedIn</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;331" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>
    <rect x="303" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;127" dur=".7s" begin="1.1s" fill="freeze"/>
    </rect>
    <text class="m val" x="726" y="14">1300 · ideal 600–1100 · ≤4 tags</text>
  </g>

  <g transform="translate(0,92)">
    <text class="f name" x="16" y="14">Instagram</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;560" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="196" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;107" dur=".7s" begin="1.2s" fill="freeze"/>
    </rect>
    <text class="m val" x="726" y="14">2200 · ideal 180–600 · ≤12 tags</text>
  </g>

  <g transform="translate(0,132)">
    <text class="f name" x="16" y="14">Email</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;407" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>
    <rect x="277" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;178" dur=".7s" begin="1.3s" fill="freeze"/>
    </rect>
    <text class="m val" x="726" y="14">1600 · ideal 500–1200 · 0 tags</text>
  </g>

  <g transform="translate(0,172)">
    <text class="f name" x="16" y="14">X / Twitter</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;71" dur="1.1s" begin="0.4s" fill="freeze"/>
    </rect>
    <rect x="181" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;33" dur=".7s" begin="1.4s" fill="freeze"/>
    </rect>
    <text class="m hard" x="726" y="14">280</text>
    <text class="m val" x="756" y="14">· ideal 120–250 · ≤2 tags</text>
  </g>

  <g transform="translate(0,212)">
    <text class="f name" x="16" y="14">TikTok</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;560" dur="1.1s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="170" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;56" dur=".7s" begin="1.5s" fill="freeze"/>
    </rect>
    <text class="m val" x="726" y="14">2200 · ideal 80–300 · ≤6 tags</text>
  </g>

  <g transform="translate(0,252)">
    <text class="f name" x="16" y="14">Facebook</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;509" dur="1.1s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="214" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;114" dur=".7s" begin="1.6s" fill="freeze"/>
    </rect>
    <text class="m val" x="726" y="14">2000 · ideal 250–700 · ≤3 tags</text>
  </g>

  <g transform="translate(0,292)">
    <text class="f name" x="16" y="14">SMS</text>
    <rect x="150" y="3" width="560" height="14" rx="7" fill="#eaeef4"/>
    <rect x="150" y="3" width="0" height="14" rx="7" fill="url(#pBar)">
      <animate attributeName="width" values="0;41" dur="1.1s" begin="0.7s" fill="freeze"/>
    </rect>
    <rect x="173" y="6" width="0" height="8" rx="4" fill="#0b7c7a" opacity=".85">
      <animate attributeName="width" values="0;16" dur=".7s" begin="1.7s" fill="freeze"/>
    </rect>
    <text class="m hard" x="726" y="14">160</text>
    <text class="m val" x="756" y="14">· ideal 90–155 · 0 tags</text>
  </g>

  <g transform="translate(150,326)">
    <rect x="0" y="-8" width="18" height="7" rx="3.5" fill="url(#pBar)"/>
    <text class="m key" x="24" y="-2">hard ceiling</text>
    <rect x="110" y="-8" width="18" height="7" rx="3.5" fill="#0b7c7a" opacity=".85"/>
    <text class="m key" x="134" y="-2">ideal band</text>
    <text class="m key" x="230" y="-2">bar length ∝ characters · 2200 = full width</text>
  </g>
</svg>
