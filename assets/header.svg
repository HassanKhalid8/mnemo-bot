<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Tone Forge - Automated Copywriting and Tone Transformer">
  <title>Tone Forge — Automated Copywriting &amp; Tone Transformer</title>
  <defs>
    <linearGradient id="hSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9e9b" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0f9e9b" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#0b7c7a" stop-opacity="1"/>
      <stop offset="1" stop-color="#0f9e9b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hMeter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7c7a"/>
      <stop offset="1" stop-color="#0f9e9b"/>
    </linearGradient>
    <clipPath id="hTopBar"><rect x="8" y="8" width="984" height="5" rx="2.5"/></clipPath>
    <clipPath id="hType"><rect x="48" y="128" width="0" height="30">
      <animate attributeName="width" values="0;0;406;406;0" keyTimes="0;0.10;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
    <pattern id="hGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .ttl{font-size:46px;font-weight:800;fill:#16202c;letter-spacing:1.2px}
    .sub{font-size:15px;font-weight:500;fill:#5a6a7d;letter-spacing:.4px}
    .typed{font-size:18px;font-weight:500;fill:#0b7c7a}
    .lbl{font-size:11px;font-weight:600;fill:#8794a5;letter-spacing:1.4px}
    .num{font-size:12px;fill:#5a6a7d}
    .pill{font-size:12px;font-weight:600;fill:#0b7c7a}

    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes drift{0%{transform:translate(0,0);opacity:.5}50%{transform:translate(0,-9px);opacity:1}100%{transform:translate(0,0);opacity:.5}}
    @keyframes beat{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

    .r1{animation:up .7s .05s ease-out both}
    .r2{animation:up .7s .20s ease-out both}
    .r3{animation:up .7s .35s ease-out both}
    .r4{animation:up .7s .50s ease-out both}
    .p1{animation:up .6s .70s ease-out both}
    .p2{animation:up .6s .82s ease-out both}
    .p3{animation:up .6s .94s ease-out both}
    .caret{animation:blink 1s steps(1) infinite}
    .dia{animation:drift 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dia2{animation-delay:1.3s}
    .dia3{animation-delay:2.6s}
    .dot{animation:beat 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  </style>

  <rect width="1000" height="250" rx="18" fill="#f4f6f9"/>
  <rect x="8" y="8" width="984" height="234" rx="15" fill="#ffffff" stroke="#d9e0ea"/>
  <rect x="8" y="8" width="984" height="234" rx="15" fill="url(#hGrid)" opacity=".55"/>

  <g clip-path="url(#hTopBar)">
    <rect x="8" y="8" width="984" height="5" fill="#e6ebf2"/>
    <rect x="-460" y="8" width="460" height="5" fill="url(#hSweep)">
      <animate attributeName="x" values="-460;1000" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="dia"><path d="M905 52 l7 7 -7 7 -7 -7 z" fill="#0f9e9b" opacity=".35"/></g>
  <g class="dia dia2"><path d="M948 188 l5 5 -5 5 -5 -5 z" fill="#0f9e9b" opacity=".3"/></g>
  <g class="dia dia3"><path d="M612 46 l5 5 -5 5 -5 -5 z" fill="#0b7c7a" opacity=".28"/></g>

  <g class="r1">
    <path d="M48 62 l9 9 -9 9 -9 -9 z" fill="#0f9e9b"/>
    <text class="f ttl" x="72" y="80">TONE FORGE</text>
  </g>

  <g class="r2">
    <text class="f sub" x="74" y="105">AUTOMATED COPYWRITING &amp; TONE TRANSFORMER</text>
  </g>

  <g class="r3">
    <rect x="48" y="116" width="0" height="2" rx="1" fill="#0f9e9b" opacity=".55">
      <animate attributeName="width" values="0;500" dur="1s" begin="0.5s" fill="freeze"/>
    </rect>
  </g>

  <g class="r4">
    <g clip-path="url(#hType)">
      <text class="m typed" x="48" y="150">Raw facts in. Platform-ready copy out.</text>
    </g>
    <rect class="caret" x="48" y="132" width="2" height="22" fill="#0f9e9b">
      <animate attributeName="x" values="48;48;454;454;48" keyTimes="0;0.10;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="p1">
    <rect x="48" y="182" width="88" height="26" rx="13" fill="#f7f9fc" stroke="#d9e0ea"/>
    <text class="f pill" x="92" y="199" text-anchor="middle">Gemini</text>
  </g>
  <g class="p2">
    <rect x="144" y="182" width="88" height="26" rx="13" fill="#f7f9fc" stroke="#d9e0ea"/>
    <text class="f pill" x="188" y="199" text-anchor="middle">OpenAI</text>
  </g>
  <g class="p3">
    <rect x="240" y="182" width="118" height="26" rx="13" fill="#f7f9fc" stroke="#d9e0ea"/>
    <text class="f pill" x="299" y="199" text-anchor="middle">Offline mock</text>
  </g>

  <g transform="translate(624,0)">
    <text class="m lbl" x="0" y="76">X / TWITTER</text>
    <rect x="0" y="86" width="300" height="12" rx="6" fill="#eaeef4"/>
    <rect x="0" y="86" width="0" height="12" rx="6" fill="url(#hMeter)">
      <animate attributeName="width" values="0;242;242;0" keyTimes="0;0.42;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text class="m num" x="300" y="118" text-anchor="end">226 / 280 chars</text>

    <text class="m lbl" x="0" y="150">SMS</text>
    <rect x="0" y="160" width="300" height="12" rx="6" fill="#eaeef4"/>
    <rect x="0" y="160" width="0" height="12" rx="6" fill="url(#hMeter)">
      <animate attributeName="width" values="0;278;278;0" keyTimes="0;0.52;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text class="m num" x="300" y="192" text-anchor="end">148 / 160 chars</text>

    <circle class="dot" cx="6" cy="115" r="4" fill="#17a34a"/>
    <text class="m num" x="18" y="119" fill="#17a34a">score 100/100</text>
  </g>
</svg>
